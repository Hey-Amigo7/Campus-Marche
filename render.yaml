services:
  - type: web
    name: campus-marche-api
    runtime: node
    plan: free
    rootDir: apps/api
    # Free plan has no preDeploy phase, so migrations run in the build.
    # This ONLY works if DATABASE_URL is the EXTERNAL (public) connection
    # string — the internal `dpg-...-a` host is unreachable from the build.
    buildCommand: >-
      pnpm install --prod=false &&
      pnpm run build &&
      { npx prisma migrate resolve --rolled-back 20260525232825_escrow_schema_sync || true; } &&
      { npx prisma migrate resolve --rolled-back 20260526000001_escrow_wallet_payout || true; } &&
      pnpm run db:migrate:deploy
    startCommand: node dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: ARKESEL_API_KEY
        sync: false
      - key: SMS_SENDER_ID
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ADMIN_SETUP_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
